name: "📰 Günlük Haber Bülteni"

on:
  schedule:
    # NOT: schedule olayı yalnızca default branch üzerinden çalışır ve UTC'dir.
    # GitHub, saatin tam başında yoğunluk arttığı için bazı işleri düşürebilir
    # ("High load times include the start of every hour ... some queued jobs may be dropped").
    # Bu yüzden dakika 00 yerine çapraz bir dakika seçiyoruz.
    # Sabah raporu: 08:13 Türkiye saati (Europe/Istanbul) = 05:13 UTC
    - cron: '13 8 * * *'
      timezone: 'Europe/Istanbul'
    # Akşam raporu: 20:07 Türkiye saati (Europe/Istanbul) = 17:07 UTC
    - cron: '7 20 * * *'
      timezone: 'Europe/Istanbul'

  # Manuel tetikleme (test için)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Rapor modu'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

# Aynı anda iki koşunun çakışmasını (ve git push yarışını) engelle
concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    # Gözlem: kota tükenmişken eski kodla iş 29-49 dakika asılı kalmıştı.
    # Düzeltilmiş model zinciriyle yerelde ~2 dakika. 15 dk güvenli bir tavan.
    timeout-minutes: 15

    # Güncellenen JSON dosyalarını commit edebilmek için
    permissions:
      contents: write

    steps:
      # 1. Kodu çek
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      # 2. Tetikleyici teşhisi — "schedule" mı "workflow_dispatch" mı belli olsun
      - name: 🔍 Tetikleyici Teşhisi
        run: |
          echo "event      = ${{ github.event_name }}"
          echo "schedule   = ${{ github.event.schedule || '-' }}"
          echo "ref        = ${{ github.ref }}"
          echo "sha        = ${{ github.sha }}"
          echo "branch     = $(git rev-parse --abbrev-ref HEAD)"
          echo "utc_now    = $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      # 3. Python kur
      - name: 🐍 Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 4. Bağımlılıkları yükle
      - name: 📦 Bağımlılıkları yükle
        run: pip install -r requirements.txt

      # 5. Rapor modunu belirle
      - name: 🕐 Rapor modunu belirle
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date -u +%H)" -lt 12 ]; then
            echo "mode=morning" >> $GITHUB_OUTPUT
          else
            echo "mode=evening" >> $GITHUB_OUTPUT
          fi

      # 5. Raporu çalıştır
      - name: 📰 Rapor oluştur ve gönder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Repo Variables'ta GEMINI_MODEL tanımlıysa onu kullan, yoksa
          # src/config.py'deki varsayılanla aynı değer.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python -m src.main --mode ${{ steps.mode.outputs.mode }}

      # 6. Üretilen HTML raporu sakla (hata ayıklamak için)
      - name: 📎 Raporu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: test_report_*.html
          retention-days: 14
          if-no-files-found: ignore

      # 7. Güncellenen data dosyalarını commit et (story tracking, quiz history vs.)
      - name: 💾 Veri dosyalarını güncelle
        continue-on-error: true
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          # Değişiklik varsa commit et, yoksa atla
          if git diff --staged --quiet; then
            echo "data/ değişmemiş, commit atlanıyor."
          else
            git commit -m "📊 Veri güncelleme: $(date -u +%Y-%m-%d_%H:%M) UTC"
            # Uzak dal bu arada ilerlemiş olabilir (manuel + scheduled çakışması)
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # 8. Başarısızlıkta sessiz kalma — alarm maili gönder
      - name: 🚨 Hata bildirimi
        if: failure()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import smtplib
          from email.mime.text import MIMEText

          body = "\n".join([
              "Gunluk Haber Bulteni is akisi basarisiz oldu.",
              "Run: " + os.environ.get("RUN_URL", "?"),
              "Tetikleyici: " + os.environ.get("GITHUB_EVENT_NAME", "?"),
              "Basarisiz adim: " + os.environ.get("GITHUB_STEP_NAME", "?"),
              "Detay icin run loglarini acin.",
          ])

          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = "[HATA] Gunluk Haber Bulteni calismadi"
          msg["From"] = os.environ["GMAIL_ADDRESS"]
          msg["To"] = os.environ["RECIPIENT_EMAIL"]

          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
              s.starttls()
              s.login(msg["From"], os.environ["GMAIL_APP_PASSWORD"])
              s.send_message(msg)

          print("Hata bildirimi gonderildi:", msg["To"])
          PY